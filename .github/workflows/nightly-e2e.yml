name: Nightly E2E Tests

# Two-dimensional compatibility canary: every supported Grafana version
# crossed with the `datetime.useLuxon` feature toggle both ON and OFF.
#
# Why this exists (HDX-12393): on 2026-09-09 a managed Grafana Cloud instance
# was upgraded to an unreleased Grafana 13.3.0 build with `datetime.useLuxon`
# enabled, breaking every dashboard that used this plugin.
#
# How this differs from e2e.yml, which already covers version × nightly:
#   1. e2e.yml runs only on a pull request or a release (ci.yml, release.yml).
#      Nothing was scheduled, so a Grafana-side change could land any night
#      without anyone finding out until the next PR.
#   2. The e2e path pins `GF_FEATURE_TOGGLES_ENABLE=datetime.useLuxon`
#      always-on (in .github/e2e-docker-compose.yml, which e2e.yml invokes).
#      That proves the plugin works *with* Luxon but can no longer prove it
#      still works *without* it, so a regression in the default (non-Luxon)
#      path on a released Grafana would slip through. This workflow varies
#      the toggle instead of fixing it.
#
# This file is a deliberate near-duplicate of e2e.yml. Keep the shared steps
# in sync; the differences are the `luxon` axis, the scheduling entry point
# (nightly-compat.yml), the toggle assertion, and the digest record.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  nightly-e2e-test:
    # Both matrix axes appear in the job name so a red square in the Actions
    # UI identifies the broken combination without having to open it.
    name: E2E - Grafana ${{ matrix.grafana_version }} (luxon=${{ matrix.luxon }})
    runs-on: ubuntu-latest
    strategy:
      # Each version × toggle pair is an independent compatibility signal;
      # one failure must not cancel the rest. e2e.yml sets this too.
      fail-fast: false
      matrix:
        grafana_version:
          - "10.4.19-security-01"
          - "11.6.16"
          - "12.4.10"
          - "13.0.8"
          - "13.1.5"
          - "13.2.1"
          # Grafana's unstable channel, rebuilt daily (~00:20-01:30 UTC).
          #
          # `grafana/grafana-dev` is deliberately NOT used: its newest tag is
          # 13.1.0-25957875840 from 2026-05-16, so it can no longer detect a
          # break in an unreleased release line -- the exact class of failure
          # this workflow exists to catch. `grafana-enterprise:nightly`
          # currently resolves to the 13.3.0 line.
          #
          # The tag floats by design; pinning it would defeat the point of a
          # canary. The "Record Grafana image digest" step captures which
          # build a given run actually tested, so a red job stays
          # reproducible after the tag has moved on.
          - "nightly"
        luxon: [false, true]
    # A hung Playwright run would otherwise sit on the 360-minute default and
    # end up `cancelled`, which evades the `if: failure()` reporting path.
    timeout-minutes: 45
    env:
      # Docker image *tag*, consumed verbatim by the compose file. Note the
      # deliberate re-blanking of this same name for the test process below.
      GRAFANA_VERSION: ${{ matrix.grafana_version }}
      # Consumed by the grafana service in .github/e2e-docker-compose.yml,
      # whose default is always-on. The empty string is meaningful here: that
      # compose entry uses `${GF_FEATURE_TOGGLES_ENABLE-...}` (single dash,
      # substitutes only when *unset*), so an explicit empty value disables
      # the toggle rather than falling back to the default.
      # The scheme also depends on Actions materialising this as *set-but-empty*
      # rather than unset when luxon=false -- that is what makes the compose
      # side's single-dash default fall through to "" instead of the default.
      GF_FEATURE_TOGGLES_ENABLE: ${{ matrix.luxon && 'datetime.useLuxon' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without this the job inherits the runner's default Node, which has
      # drifted to Node 22 / npm 10 -- below the `engines` floor (node >=24)
      # and unable to `npm ci` a lockfile written by npm 11.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download GitHub artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-package

      - name: Extract and prepare plugin
        run: |
          unzip hydrolix-hydrolix-datasource*.zip
          chmod +x hydrolix-hydrolix-datasource/gpx*

      - name: Install and run Docker Compose
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9
        with:
          compose-file: '.github/e2e-docker-compose.yml'

      - name: Record Grafana image digest
        # See .github/scripts/record-grafana-image.sh for why a floating tag
        # still needs to be pinned after the fact.
        env:
          LUXON: ${{ matrix.luxon }}
        run: ./.github/scripts/record-grafana-image.sh

      - name: Install Playwright
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx playwright install

      - name: Wait for Grafana
        # `curl -s` without `-f` exits 0 on ANY response, including the 503
        # Grafana returns while still starting -- so the gate would clear the
        # moment the port accepts a connection. The next step then fails with
        # an opaque curl error and looks like a compatibility problem.
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:3000/api/health >/dev/null; do sleep 2; done' || {
            echo "::error::Grafana ${GRAFANA_VERSION} never became healthy within 120s."
            docker logs grafana 2>&1 | tail -100
            exit 1
          }

      - name: Verify feature toggle state
        # Guards the toggle axis against silently collapsing -- see
        # .github/scripts/verify-feature-toggle.sh (and its .test.sh).
        env:
          EXPECT: ${{ matrix.luxon }}
        run: ./.github/scripts/verify-feature-toggle.sh

      - name: Run E2E tests
        id: e2e
        # Tolerance sits on the STEP, not the job. Job-level continue-on-error
        # would make the job report success, skip `report-failure` entirely,
        # and leave the one cell that reproduces the 2026-09-09 incident
        # (nightly x luxon=true) green and silent -- a canary that cannot
        # report is worse than none, because people trust it.
        #
        # The nightly rung tracks Grafana main and is red today for unrelated
        # locator timeouts (14 of 59 tests in CI), so it must not turn the
        # scheduled run red and file an issue every night. Step-level keeps
        # the run green while the step below makes the outcome visible.
        continue-on-error: ${{ matrix.grafana_version == 'nightly' }}
        run: npx playwright test --reporter=junit
        env:
          # The job-level GRAFANA_VERSION is a docker image *tag*, and compose
          # needs it verbatim. plugin-e2e reads the same variable as a semver
          # (`process.env.GRAFANA_VERSION || bootData.version`) and branches on
          # it inside its page models. Its comparator parses with parseInt, so
          # a non-semver tag like "nightly" yields NaN and every gte/lt returns
          # false -- each of those ~45 branches silently takes its oldest path.
          # Blanking the variable here makes plugin-e2e read the running
          # Grafana's real version from bootData. Correct for every matrix
          # entry, not just nightly. (Condensed from e2e.yml; see there for the
          # addPanel / resolveSelectors detail.)
          GRAFANA_VERSION: ""
          E2E_GRAFANA_URL: http://localhost:3000
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit_report.xml
          # Playwright runs on the runner host here, not inside the compose
          # network, so the `clickhouse-server` service name doesn't resolve
          # for tests that talk to ClickHouse directly (system.query_log
          # lookups). Only the published port is reachable. This is separate
          # from CLICKHOUSE_HOSTNAME, which is the address Grafana uses from
          # inside its container and must stay the service name.
          E2E_CLICKHOUSE_HTTP_HOST: localhost

      - name: Flag tolerated nightly failure
        if: steps.e2e.outcome == 'failure'
        # Only reachable on the nightly rung (every other rung fails the job
        # outright). Emits a run-page annotation and a summary line so a
        # tolerated failure leaves a durable, greppable record instead of a
        # green square.
        run: |
          MSG="Grafana ${GRAFANA_VERSION} luxon=${{ matrix.luxon }} failed (advisory, non-blocking)"
          echo "::warning title=Nightly rung failed::${MSG} -- see artifact e2e-results-${GRAFANA_VERSION}-luxon-${{ matrix.luxon }}"
          echo "**ADVISORY FAILURE** — ${MSG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Grafana logs
        # `!cancelled()` rather than `failure()`: a tolerated nightly failure
        # leaves the job green, and a cancelled job (timeout) is exactly when
        # the log matters most. A plugin-load failure -- the incident's
        # signature -- shows up in Grafana's own log, not the Playwright report.
        if: ${{ !cancelled() && steps.e2e.outcome != 'success' }}
        run: |
          if ! docker logs grafana > grafana.log 2>&1; then
            echo "::warning title=Grafana logs unavailable::docker logs grafana failed; grafana.log holds the docker error, not Grafana output."
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          # Both axes in the artifact name, matching the job name, so a
          # downloaded bundle is attributable without cross-referencing.
          name: e2e-results-${{ matrix.grafana_version }}-luxon-${{ matrix.luxon }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            junit_report.xml
            grafana-image.txt
            grafana.log
          retention-days: 7
