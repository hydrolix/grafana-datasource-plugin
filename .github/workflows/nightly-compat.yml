name: Nightly Compatibility

# Scheduled entry point for the compatibility canary (HDX-12393). Builds the
# plugin the way ci.yml does, then runs nightly-e2e.yml. Additive: the reused
# workflows and ci.yml/e2e.yml are unchanged.

on:
  schedule:
    # After Grafana republishes the nightly image (~00:20-01:30 UTC), off the
    # top of the hour where scheduled runs queue longest.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-tests:
    # Gates the e2e matrix (see `needs` below); the build/package jobs run
    # regardless. Seconds against a matrix that runs up to an hour.
    name: Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Plain node — jest.config.js is scoped to src/.
      - name: Run report-nightly-failure tests
        run: node .github/scripts/report-nightly-failure.test.js

  build-frontend:
    name: Build Frontend
    uses: ./.github/workflows/build-frontend.yml
    with:
      node_version: '24'

  build-backend:
    name: Build Backend
    uses: ./.github/workflows/build-backend.yml
    with:
      # Keep in step with ci.yml and go.mod, or the toolchain re-downloads.
      go_version: '1.26.8'

  package:
    name: Package Plugin
    uses: ./.github/workflows/package.yml
    needs: [build-frontend, build-backend]
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      node_version: '24'
    secrets:
      grafana_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

  nightly-e2e:
    name: Nightly E2E Tests
    uses: ./.github/workflows/nightly-e2e.yml
    needs: [package, script-tests]

  report-failure:
    name: Report Failure
    # Not bare `failure()`: that is false when a dependency is CANCELLED, so a
    # rung that hangs to its job timeout would go entirely unreported. The
    # `!cancelled()` guard keeps a human cancelling the whole run quiet.
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [script-tests, build-frontend, build-backend, package, nightly-e2e]
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow default, so contents: read
      # must be listed for the checkout below.
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/report-nightly-failure.js');
            await report({ github, context, core });

      # DECISION NEEDED — Slack is not wired up: this repo has no Slack
      # credential and no agreed channel for the plugin's CI. To enable, add a
      # bot token and copy hydrolix/turbine's send-slack-job-status.js. Guard
      # on `env`, not `secrets` — the secrets context is unavailable in a
      # step-level `if:`.
      #
      # - name: Notify Slack
      #   env:
      #     SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      #     SLACK_CHANNEL: '#TBD'
      #   if: env.SLACK_BOT_TOKEN != ''
      #   uses: actions/github-script@v9
      #   with:
      #     script: |
      #       // see hydrolix/turbine .github/scripts/send-slack-job-status.js
