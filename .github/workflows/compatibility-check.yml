name: Compatibility Check

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: true
        type: string

jobs:
  compatibilitycheck:
    name: Compatibility Check - Grafana ${{ matrix.grafana_version }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    strategy:
      matrix:
        grafana_version: ["10.4.19-security-01", "11.6.16", "12.4.10", "13.0.8", "13.1.5", "13.2.1"]
    env:
      GRAFANA_VERSION: ${{ matrix.grafana_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Set version
        run: ./.github/scripts/set-version.sh

      - name: Compatibility check
        uses: grafana/plugin-actions/is-compatible@6a283a4015776c4becd1708906b59b2e78c221ae # is-compatible/v1.0.4
        with:
          module: "./src/module.ts"
          comment-pr: "yes"
          fail-if-incompatible: "yes"
