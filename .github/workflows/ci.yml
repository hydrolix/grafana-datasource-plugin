name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run set-version tests
        run: ./.github/scripts/set-version.test.sh

  main-ancestry-gate:
    name: Base main Ancestry Gate
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the source branch contains main's tip
        env:
          # The PR head, not the checked-out HEAD: on pull_request the checkout
          # is the merge ref, which contains main by construction and would
          # make this assertion vacuously true.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch main fresh: the event payload's base.sha is the base tip as
          # of the last PR event, not the tip the merge commit will carry.
          git fetch origin main
          MAIN_TIP=$(git rev-parse origin/main)
          if git merge-base --is-ancestor "$MAIN_TIP" "$HEAD_SHA"; then
            echo "origin/main tip $MAIN_TIP is contained in PR head $HEAD_SHA"
          else
            echo "The source branch is missing origin/main's tip commit $MAIN_TIP."
            echo "Merge main into the source branch and push: git fetch origin && git merge origin/main"
            exit 1
          fi

  build-frontend:
    name: Build Frontend
    uses: ./.github/workflows/build-frontend.yml
    with:
      node_version: '24'

  test-frontend:
    name: Test Frontend
    uses: ./.github/workflows/test-frontend.yml
    with:
      node_version: '24'

  compatibility-check:
    name: Compatibility Check
    uses: ./.github/workflows/compatibility-check.yml
    needs: build-frontend
    permissions:
      pull-requests: write
      contents: read
    with:
      node_version: '24'

  build-backend:
    name: Build Backend
    uses: ./.github/workflows/build-backend.yml
    with:
      go_version: '1.26.5'

  test-backend:
    name: Test Backend
    uses: ./.github/workflows/test-backend.yml
    with:
      go_version: '1.26.5'

  package:
    name: Package Plugin
    uses: ./.github/workflows/package.yml
    needs: [build-frontend, build-backend]
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      node_version: '24'
    secrets:
      grafana_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

  e2e:
    name: E2E Tests
    uses: ./.github/workflows/e2e.yml
    needs: [package]

  plugin-validator:
    name: Plugin Validator
    uses: ./.github/workflows/validate.yml
    needs: [package]
    with:
      node_version: '24'