name: Packege

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: true
        type: string
      attest:
        description: "Create a build provenance attestation for the packaged ZIP"
        required: false
        type: boolean
        default: false
      require_signature:
        description: "Fail when grafana_token is empty instead of packaging unsigned. Defaults to true so release paths fail closed; only PR CI should pass false."
        required: false
        type: boolean
        default: true
    secrets:
      # Optional: a caller may lack the token (PRs without secrets access);
      # require_signature decides whether that is an error.
      grafana_token:
        description: "Grafana access policy token for signing"
        required: false

jobs:
  package:
    name: Package Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: dist/

      - name: Set version
        run: ./.github/scripts/set-version.sh

      # Decide in the shell: a missing token must fail or skip depending on
      # require_signature, and a step-level `if:` can only skip (it also can't
      # read the secrets context). Only an explicit "false" skips, so any
      # unexpected value fails closed.
      - name: Sign plugin
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.grafana_token }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signature }}
        run: |
          if [[ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]]; then
            if [[ "$REQUIRE_SIGNATURE" != "false" ]]; then
              echo "::error::GRAFANA_ACCESS_POLICY_TOKEN is empty and this caller requires a signed package (require_signature=$REQUIRE_SIGNATURE)"
              exit 1
            fi
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not available to this run; packaging the plugin unsigned. Expected for Dependabot and fork PRs; otherwise the repository secret is missing."
            echo "- Signing: skipped (no token available); the package is **unsigned**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes @grafana/sign-plugin@latest
          # sign-plugin exiting 0 is not proof of a signature; the manifest is.
          if [[ ! -s dist/MANIFEST.txt ]]; then
            echo "::error::sign-plugin exited successfully but dist/MANIFEST.txt is missing or empty"
            exit 1
          fi

      - name: Create package
        run: |
          PLUGIN_NAME=$(npm pkg get name | tr -d '"')
          PLUGIN_VERSION=$(npm pkg get version | tr -d '"')
          ZIP_NAME=$PLUGIN_NAME-$PLUGIN_VERSION.zip
          chmod 0775 dist/gpx_*
          mv dist/ "$PLUGIN_NAME"/
          zip "$ZIP_NAME" "$PLUGIN_NAME" -r

      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: "*.zip"
          retention-days: 7