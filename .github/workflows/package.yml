name: Package

# Build the plugin zip from previously-uploaded frontend / backend artifacts.
# Signs and attests only when `sign` is true (post-merge stable releases). Pre-
# merge PR runs pass sign=false — the resulting zip carries no signature and
# is not eligible for the catalog, but is fine for plugin-validator and e2e.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: true
        type: string
      sign:
        description: "Sign the plugin and produce a build-provenance attestation"
        required: false
        type: boolean
        default: false
    secrets:
      grafana_token:
        description: "Grafana access policy token (required when sign=true)"
        required: false
    outputs:
      version:
        description: "Plugin version (read from manifest after set-version.sh runs)"
        value: ${{ jobs.package.outputs.version }}
      zip_name:
        description: "Packaged zip filename"
        value: ${{ jobs.package.outputs.zip_name }}

jobs:
  package:
    name: Package Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.create.outputs.version }}
      zip_name: ${{ steps.create.outputs.zip_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: dist/

      - name: Set version
        run: ./.github/scripts/set-version.sh

      - name: Sign plugin
        if: ${{ inputs.sign }}
        run: npx --yes @grafana/sign-plugin@latest
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.grafana_token }}

      - name: Create package
        id: create
        run: |
          PLUGIN_NAME=$(npm pkg get name | tr -d '"')
          PLUGIN_VERSION=$(npm pkg get version | tr -d '"')
          ZIP_NAME=$PLUGIN_NAME-$PLUGIN_VERSION.zip
          chmod 0775 dist/gpx_*
          mv dist/ "$PLUGIN_NAME/"
          zip "$ZIP_NAME" "$PLUGIN_NAME" -r
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ inputs.sign }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: "*.zip"
          retention-days: 7
