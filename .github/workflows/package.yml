name: Packege

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: true
        type: string
      attest:
        description: "Create a build provenance attestation for the packaged ZIP"
        required: false
        type: boolean
        default: false
      require_signature:
        description: "Fail when grafana_token is empty instead of packaging unsigned"
        required: false
        type: boolean
        default: true
    secrets:
      # Optional so PR CI can package without it: Dependabot and fork PRs
      # don't receive Actions secrets. require_signature decides whether a
      # missing token is an error.
      grafana_token:
        description: "Grafana access policy token for signing"
        required: false

jobs:
  package:
    name: Package Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: dist/

      - name: Set version
        run: ./.github/scripts/set-version.sh

      # Guard in the shell, not a step-level `if:` — the secrets context is
      # unavailable there.
      - name: Sign plugin
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.grafana_token }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signature }}
        run: |
          if [[ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]]; then
            if [[ "$REQUIRE_SIGNATURE" == "true" ]]; then
              echo "::error::GRAFANA_ACCESS_POLICY_TOKEN is empty and this caller requires a signed package"
              exit 1
            fi
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not available to this run; packaging the plugin unsigned"
            echo "- Signing: skipped (no token available); the package is **unsigned**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes @grafana/sign-plugin@latest

      - name: Create package
        run: |
          PLUGIN_NAME=$(npm pkg get name | tr -d '"')
          PLUGIN_VERSION=$(npm pkg get version | tr -d '"')
          ZIP_NAME=$PLUGIN_NAME-$PLUGIN_VERSION.zip
          chmod 0775 dist/gpx_*
          mv dist/ "$PLUGIN_NAME"/
          zip "$ZIP_NAME" "$PLUGIN_NAME" -r

      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: "*.zip"
          retention-days: 7