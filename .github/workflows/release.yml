name: Draft GitHub Release

# Push the release tag onto the supplied commit, then create a draft GitHub
# release pointing at the tag, with body parsed out of CHANGELOG.md.
#
# Both steps are idempotent: re-running this workflow against the same
# version + SHA either creates the resource or no-ops.

on:
  workflow_call:
    inputs:
      version:
        description: "Clean release version, e.g. 1.2.3 (no leading v, no -rcN, no -dev)"
        required: true
        type: string
      sha:
        description: "Commit SHA to tag (defaults to GITHUB_SHA)"
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Push tag and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Download signed plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: /tmp/plugin-package

      - name: Parse changelog
        id: parse
        run: |
          BODY=$(./.github/scripts/parse-changelog.sh CHANGELOG.md "${{ inputs.version }}")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally; not re-creating"
          else
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: true
          name: ${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ inputs.sha || github.sha }}
          files: /tmp/plugin-package/*.zip
          fail_on_unmatched_files: true
          body: ${{ steps.parse.outputs.body }}
