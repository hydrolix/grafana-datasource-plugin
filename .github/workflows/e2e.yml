name: E2E Tests

on:
  workflow_call:


jobs:
  e2e-test:
    name: E2E Test - Grafana ${{ matrix.grafana_version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the rest of the matrix — each
      # Grafana version is an independent compatibility signal.
      fail-fast: false
      matrix:
        grafana_name: ["grafana-enterprise"]
        grafana_version: ["11.6.16", "12.4.10", "13.0.8", "13.1.5", "13.2.1", "nightly"]
    # The nightly image tracks Grafana main, so a failure there is an early
    # warning about an unreleased Grafana, not a plugin regression — it must
    # not block the release pipeline this workflow gates.
    # continue-on-error: ${{ matrix.grafana_version == 'nightly' }}
    env:
      GRAFANA_VERSION: ${{ matrix.grafana_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This job had no Node setup and silently used the runner's default,
      # which drifted to Node 22 / npm 10 — below the `engines` floor and
      # unable to `npm ci` a lockfile written by npm 11. Pin to .nvmrc so
      # every job resolves the same toolchain.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download GitHub artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-package

      - name: Extract and prepare plugin
        run: |
          unzip hydrolix-hydrolix-datasource*.zip
          chmod +x hydrolix-hydrolix-datasource/gpx*

      - name: Install and run Docker Compose
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9
        with:
          compose-file: '.github/e2e-docker-compose.yml'

      - name: Install Playwright
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx playwright install

      - name: Wait for Grafana
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:3000/api/health; do sleep 2; done'

      - name: Run E2E tests
        run: npx playwright test --reporter=junit
        env:
          # The job-level GRAFANA_VERSION is a docker image *tag*, and compose
          # needs it verbatim. plugin-e2e reads the same variable as a semver
          # (`process.env.GRAFANA_VERSION || bootData.version`) and branches on
          # it inside its page models. Its comparator parses with parseInt, so
          # a non-semver tag like "nightly" yields NaN and every gte/lt returns
          # false — each of those ~45 branches silently takes its oldest path.
          # DashboardPage.addPanel() then clicks the Grafana-8 "Add new panel"
          # testid and times out against the current dashboard edit pane.
          # (The selector catalog itself is unaffected: resolveSelectors falls
          # back to "latest" on an invalid semver. Only the imperative
          # branching misfires, which is why the failure looked selective.)
          # Blanking the variable here makes plugin-e2e read the running
          # Grafana's real version from bootData. Correct for every matrix
          # entry, not just nightly.
          GRAFANA_VERSION: ""
          E2E_GRAFANA_URL: http://localhost:3000
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit_report.xml
          # Playwright runs on the runner host here, not inside the compose
          # network, so the `clickhouse-server` service name doesn't resolve
          # for tests that talk to ClickHouse directly (system.query_log
          # lookups). Only the published port is reachable. This is separate
          # from CLICKHOUSE_HOSTNAME, which is the address Grafana uses from
          # inside its container and must stay the service name.
          E2E_CLICKHOUSE_HTTP_HOST: localhost

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-${{ matrix.grafana_version }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            junit_report.xml
          retention-days: 7
