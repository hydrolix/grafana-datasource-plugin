name: Lint Backend

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to use"
        required: true
        type: string

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ inputs.go_version }}

      # Runs the linters from .golangci.yml, including gosec. Keep the version
      # in step with .pre-commit-config.yaml.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
