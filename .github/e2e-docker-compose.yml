services:
  grafana:
    container_name: grafana
    image: grafana/grafana-enterprise:${GRAFANA_VERSION}
    ports:
      - 3000:3000
    volumes:
      - ../hydrolix-hydrolix-datasource:/var/lib/grafana/plugins/hydrolix-hydrolix-datasource
      # Replaces the image's grafana.ini, which is all comments, with the
      # two [plugin.<id>] keys the exchanging mode needs (see that file).
      - ../e2e/grafana.ini:/etc/grafana/grafana.ini:ro
      # The exchanging mode refuses an unverified certificate for both the
      # exchange and the cluster, so the plugin must trust the stub's. Go
      # reads every file in /etc/ssl/certs, and a plugin process gets none
      # of Grafana's environment, so a file here works where SSL_CERT_FILE
      # cannot. A `subpath` mount needs Compose 2.24 or newer.
      - type: volume
        source: exchange-stub-certs
        target: /etc/ssl/certs/exchange-stub.pem
        read_only: true
        volume:
          subpath: cert.pem
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/login"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_started
      # Healthy means its certificate is on the shared volume, which the
      # trust-store mount below needs to exist before Grafana starts.
      exchange-stub:
        condition: service_healthy
    environment:
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=true
      - NODE_ENV=development
      - GF_LOG_FILTERS=plugin.hydrolix-hydrolix-datasource:debug
      - GF_LOG_LEVEL=debug
      - GF_DATAPROXY_LOGGING=1
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=hydrolix-hydrolix-datasource
      # Luxon-backed datetime layer (lands in Grafana 13.3, default-off).
      # Single dash, not `:-`: substitutes only when *unset*, so
      # nightly-e2e.yml can pass an explicit empty string to disable it. `:-`
      # would read that as "use the default" and collapse its matrix.
      - GF_FEATURE_TOGGLES_ENABLE=${GF_FEATURE_TOGGLES_ENABLE-datetime.useLuxon}
      # plugin-e2e logs in once and freezes the grafana_session cookie into
      # playwright/.auth/admin.json; every test and both workers replay that
      # one snapshot and never follow a Set-Cookie rotation. Grafana keeps a
      # single "previous token" slot, so two rotations evict the frozen token
      # and every later request 401s with "user token not found" — the whole
      # suite then sits on the login page. Verified locally against 13.3:
      # at a 1-minute interval the frozen cookie dies after ~130s (two
      # cycles); at 60 minutes it survives. 60 comfortably outlasts a run
      # (~5 min healthy) without disabling rotation outright.
      - GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES=60
      # Grafana caches each user's RBAC permissions for 60s and, on 11.x,
      # does not refresh them when a dashboard is created, so a signed-in
      # user whose permissions were read a moment ago is refused a dashboard
      # the admin has just made. tests/exchangeCredentials.spec.ts creates
      # one per test and loads it as alice at once; without this, 11.6 answered
      # "Access denied to this dashboard" on the second test in a row.
      - GF_RBAC_PERMISSION_CACHE=false
      # --- OAuth2 / Keycloak (tests/exchangeCredentials.spec.ts) ---
      # Mirrors docker-compose.yaml. The browser runs on the runner host, so
      # the auth URL is the published port; Grafana itself reaches Keycloak
      # by service name.
      - GF_SERVER_ROOT_URL=http://localhost:3000/
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ICON=signin
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=grafana-client-secret
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email roles
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:8080/realms/grafana/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/grafana/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/grafana/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_SIGNOUT_REDIRECT_URL=http://localhost:3000/login
      # --- Forward OAuth + Exchange ---
      # Grafana passes a plugin only the keys of its [plugin.<id>] section,
      # as GF_PLUGIN_<KEY>; e2e/grafana.ini declares the two keys and these
      # values replace them. The audience in the credential map is the
      # datasource HOST, so it must be the stub's service name. https, on the
      # stub's TLS listener: the plugin refuses any other URL.
      - GF_PLUGIN_EXCHANGE_URL=https://exchange-stub:9443/token
      - GF_PLUGIN_EXCHANGE_CREDENTIALS={"exchange-stub":{"client_id":"grafana-e2e","client_secret":"e2e-delegate-secret"}}
    networks:
      - grafana

  # Signs alice in for tests/exchangeCredentials.spec.ts. The realm is the
  # one the dev stack imports; the browser reaches it on the published port.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - 8080:8080
    volumes:
      - ../provisioning/keycloak/grafana-realm.json:/opt/keycloak/data/import/grafana-realm.json:ro
    networks:
      - grafana

  # Stand-in for the console's token exchange and for a cluster that takes a
  # bearer token (e2e/exchange-stub/main.go). Mirrors docker-compose.yaml;
  # only the control port is published, for the spec running on the host.
  exchange-stub:
    build: ../e2e/exchange-stub
    container_name: exchange-stub
    depends_on:
      - clickhouse-server
    environment:
      - STUB_CERT_DIR=/certs
      - STUB_CLIENT_ID=grafana-e2e
      - STUB_CLIENT_SECRET=e2e-delegate-secret
      - STUB_AUDIENCE=exchange-stub
      - STUB_UPSTREAM=http://clickhouse-server:8123
      - STUB_UPSTREAM_USER=testuser
      - STUB_UPSTREAM_PASSWORD=testpass
      - STUB_TOKEN_TTL=300s
    volumes:
      - exchange-stub-certs:/certs
    # The control port answers only once the certificate is written.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/e2e/events"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports:
      - 9080:9080
    networks:
      - grafana

  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - 8123:8123
      - 9000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "clickhouse-server", "--query", "SELECT 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - ../testdata/containers:/testdata
    environment:
      - CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS=1
      - CLICKHOUSE_SKIP_USER_SETUP=0
      - CLICKHOUSE_USER=testuser
      - CLICKHOUSE_PASSWORD=testpass
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /testdata/tcconfig.xml /etc/clickhouse-server/config.d/tcconfig.xml
        cp /testdata/initdb.sql /docker-entrypoint-initdb.d/initdb.sql
        exec /entrypoint.sh "$@"
    networks:
      - grafana

networks:
  grafana:

volumes:
  # The exchange stub's TLS certificate, shared into Grafana's trust store.
  exchange-stub-certs: {}
