version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    ignore:
      # eslint-plugin-react only accepts eslint up to ^9.7. Lift once it supports ESLint 10.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      # From 13.2 these require React 19 (schema moves in lockstep). Lift with the React 19 migration.
      - dependency-name: '@grafana/data'
        versions: ['>=13.2.0']
      - dependency-name: '@grafana/i18n'
        versions: ['>=13.2.0']
      - dependency-name: '@grafana/runtime'
        versions: ['>=13.2.0']
      - dependency-name: '@grafana/schema'
        versions: ['>=13.2.0']
      - dependency-name: '@grafana/ui'
        versions: ['>=13.2.0']
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'github.com/grafana/grafana-plugin-sdk-go'
        dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
