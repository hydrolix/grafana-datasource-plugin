version: "3.4"
x-common-variables: &common-variables
  CLUSTER_NODE:
  REDIS_USERNAME: chproxy
  REDIS_PASSWORD:
  HYDROLIX_USERNAME:
  HYDROLIX_PASSWORD:
  GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource 4.8.2"
volumes:
  prometheus_data: {}
  # The exchange stub's TLS certificate, kept across restarts so a running
  # Grafana keeps trusting it (e2e/exchange-stub/main.go, certificate).
  exchange-stub-certs: {}
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - 8080:8080
    volumes:
      - ./provisioning/keycloak/grafana-realm.json:/opt/keycloak/data/import/grafana-realm.json:ro
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    container_name: grafana-dashboards
    depends_on:
      keycloak:
        condition: service_started
      # Healthy means its certificate is on the shared volume, which the
      # trust-store mount below needs to exist before Grafana starts.
      exchange-stub:
        condition: service_healthy
    environment:
      <<: *common-variables
      # Comma-separated feature toggles, e.g. to reproduce a nightly-e2e
      # failure: GF_FEATURE_TOGGLES_ENABLE=datetime.useLuxon npm run server
      # Runtime var, so no rebuild — unlike grafana_version, a build arg.
      # Not in .config/docker-compose-base.yaml: that file is scaffold-owned.
      GF_FEATURE_TOGGLES_ENABLE: "${GF_FEATURE_TOGGLES_ENABLE:-}"
      # --- OAuth2 / Keycloak ---
      GF_SERVER_ROOT_URL: "http://localhost:3000/"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_ICON: "signin"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "grafana-client-secret"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:8080/realms/grafana/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/grafana/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/grafana/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "http://localhost:3000/login"
      # --- Forward OAuth + Exchange (tests/exchangeCredentials.spec.ts) ---
      # Grafana passes a plugin only the keys of its [plugin.<id>] section,
      # as GF_PLUGIN_<KEY>; e2e/grafana.ini declares the two keys empty and
      # these values replace them (pluginSettingsEnvVars reads the process
      # environment for every declared key). The audience in the credential
      # map is the datasource HOST, so it must be the stub's service name.
      # https, on the stub's TLS listener: the plugin refuses any other URL.
      GF_PLUGIN_EXCHANGE_URL: "https://exchange-stub:9443/token"
      GF_PLUGIN_EXCHANGE_CREDENTIALS: '{"exchange-stub":{"client_id":"grafana-e2e","client_secret":"e2e-delegate-secret"}}'
    volumes:
      # Merged with the base file's mounts. Replaces the image's grafana.ini,
      # which is all comments, with the two-key file above.
      - ./e2e/grafana.ini:/etc/grafana/grafana.ini:ro
      # The exchanging mode refuses an unverified certificate for both the
      # exchange and the cluster, so the plugin must trust the stub's. Go reads
      # every file in /etc/ssl/certs, and a plugin process gets none of
      # Grafana's environment, so a file here works where SSL_CERT_FILE cannot.
      - type: volume
        source: exchange-stub-certs
        target: /etc/ssl/certs/exchange-stub.pem
        read_only: true
        volume:
          subpath: cert.pem
    build:
      args:
        grafana_version: 13.2.1
    #    grafana_version: 12.3.1
    #    grafana_version: 12.0.2
    #    grafana_version: 11.5.4
        development: true
        anonymous_auth_enabled: "true"
        # Must be >= the `go` directive in go.mod, otherwise mage inside the
        # container has to GOTOOLCHAIN-download a newer toolchain on every build.
        GO_VERSION: 1.27.3


  # Stand-in for the console's token exchange and for a cluster that takes a
  # bearer token (e2e/exchange-stub/main.go). The plugin exchanges a signed-in
  # user's Keycloak token here, then queries "the cluster" here over TLS with
  # the minted bearer; the stub forwards the query to clickhouse-server with
  # the fixture user. /e2e/* lets a test read what it saw and break things.
  exchange-stub:
    build: e2e/exchange-stub
    container_name: exchange-stub
    depends_on:
      - clickhouse-server
    environment:
      STUB_CERT_DIR: /certs
      STUB_CLIENT_ID: grafana-e2e
      STUB_CLIENT_SECRET: e2e-delegate-secret
      STUB_AUDIENCE: exchange-stub
      STUB_UPSTREAM: http://clickhouse-server:8123
      STUB_UPSTREAM_USER: testuser
      STUB_UPSTREAM_PASSWORD: testpass
      STUB_TOKEN_TTL: 300s
    volumes:
      - exchange-stub-certs:/certs
    # The control port answers only once the certificate is written.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/e2e/events"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports:
      - 9080:9080
      - 9443:9443

  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "clickhouse-server", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - 8123:8123
    volumes:
      - ./testdata/containers:/testdata
    environment:
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      CLICKHOUSE_SKIP_USER_SETUP: "0"
      CLICKHOUSE_USER: testuser
      CLICKHOUSE_PASSWORD: testpass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /testdata/tcconfig.xml /etc/clickhouse-server/config.d/tcconfig.xml
        cp /testdata/initdb.sql /docker-entrypoint-initdb.d/initdb.sql
        exec /entrypoint.sh "$@"

  # Playwright e2e runner. Joins the grafana service's network namespace so
  # the tests reach the dev Grafana on `localhost:3000`.
  #
  # The image is built once via `.config/playwright/Dockerfile` and bakes in
  # Node 22, the npm dependencies (npm ci off package.json + package-lock.json)
  # and the Chromium browser. Subsequent `docker compose run --rm playwright`
  # invocations skip the install entirely — they start in seconds instead of
  # the previous 4–5 minutes per run.
  #
  # Rebuild the image when package.json/package-lock.json changes (Docker
  # invalidates the npm-ci layer automatically) or when bumping
  # @playwright/test (so the bundled browser stays in sync):
  #
  #   docker compose build playwright
  #
  # Run on-demand (the service does not start with `docker compose up` since
  # there's no `command:` / `restart:` keeping it alive — use `run`):
  #
  #   docker compose run --rm playwright                                  # full suite
  #   docker compose run --rm playwright tests/configEditor.spec.ts       # one spec
  #   docker compose run --rm playwright --grep "interpolated query"      # ad-hoc
  #
  # CLICKHOUSE_* and HYDROLIX_* are declared empty so they pass through from
  # the host shell when set — matching the pattern used by the grafana
  # service's x-common-variables block.
  playwright:
    build:
      context: .
      dockerfile: .config/playwright/Dockerfile
    container_name: playwright-e2e
    # Share the grafana container's network namespace so `localhost:3000`
    # inside this container reaches the dev grafana directly (no separate
    # service DNS / port mapping needed). `depends_on` is also expressed
    # via the shared network — when grafana isn't up, this would fail fast.
    network_mode: "service:grafana"
    depends_on:
      - grafana
    working_dir: /work
    volumes:
      - .:/work
      # Anonymous volume preserves the image-baked node_modules through the
      # `.:/work` bind mount. On first container start the volume is
      # initialised from the image's /work/node_modules; on subsequent
      # `--rm` runs it is re-initialised the same way (fast filesystem copy,
      # not a fresh npm install), so we never hit the network for deps at
      # test time and the host's macOS-built binaries never leak in.
      - /work/node_modules
    environment:
      # Default to the dev compose grafana. Override from the host shell to
      # point the suite at a non-compose Grafana, e.g.
      #   E2E_GRAFANA_URL=https://grafana.example/ docker compose run --rm playwright
      E2E_GRAFANA_URL: "${E2E_GRAFANA_URL:-http://localhost:3000}"
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: /work/junit_report.xml
      CI: "1"
      CLICKHOUSE_HOSTNAME:
      CLICKHOUSE_USERNAME:
      CLICKHOUSE_PASSWORD:
      # Address the *test process* uses to reach ClickHouse's HTTP interface
      # directly (system.query_log lookups), as opposed to CLICKHOUSE_HOSTNAME
      # which is the address grafana uses. Inside this container both are the
      # compose service name, so the default is fine; runners that execute the
      # suite outside the compose network must set it (see .github/workflows/e2e.yml).
      E2E_CLICKHOUSE_HTTP_HOST:
      HYDROLIX_USERNAME:
      HYDROLIX_PASSWORD:
      # tests/exchangeCredentials.spec.ts runs only when the stub is named,
      # and reads it over its plain port. The cluster host is what the
      # datasource under test is pointed at: the stub's TLS listener, by the
      # name the credential map above is keyed on.
      E2E_EXCHANGE_STUB_URL: "http://exchange-stub:9080"
      E2E_EXCHANGE_CLUSTER_HOST: exchange-stub
      # Grafana sends the browser to Keycloak at localhost:8080, which inside
      # this container is nobody; the spec forwards that port to the real one.
      E2E_KEYCLOAK_URL: "http://keycloak:8080"

