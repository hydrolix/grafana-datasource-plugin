; Grafana configuration for the dev stack. Only the exchanging credentials
; mode needs it.
;
; Grafana hands a backend plugin the KEYS of its [plugin.<id>] section as
; GF_PLUGIN_<KEY> and passes nothing else from its own environment, so the
; two keys have to exist here for the plugin to see them at all. Their real
; values live in docker-compose.yaml: Grafana substitutes
; GF_PLUGIN_EXCHANGE_URL and GF_PLUGIN_EXCHANGE_CLIENT_SECRETS from the
; container's environment for every declared key (pluginSettingsEnvVars).
;
; The placeholders are not empty on purpose. Grafana merges a custom ini onto
; its defaults key by key and SKIPS a key whose value is empty
; (loadSpecifiedConfigFile), so an empty declaration is no declaration.
; Without the compose variables these placeholders make the plugin report
; the mode as half configured, which is the honest answer.
[plugin.hydrolix-hydrolix-datasource]
exchange_url = unset
exchange_client_secrets = {}
