# Install once per clone:
#   pre-commit install
# (default_install_hook_types below installs both the pre-commit and pre-push hooks)
#
# pre-commit: fast, staged files only, runs on every commit.
# pre-push:   whole-repo checks that mirror CI, runs on `git push`.
# Left to CI only: e2e, the production build, the plugin validator, govulncheck.
default_install_hook_types: [pre-commit, pre-push]

# Hooks run at commit time unless they set `stages` themselves.
default_stages: [pre-commit]

# .config/ is managed by Grafana plugin tools; dist/ is build output.
exclude: ^(\.config/|dist/|node_modules/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict # macOS is case-insensitive, CI (Linux) is not
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # Workflow edits can't be run locally; lint them before they reach CI.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        # Replaces the hook's default args, so --no-progress is repeated.
        args: [--no-progress, --min-severity=medium]

  # Staged changes only; allowlist for test fixtures lives in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^\.github/scripts/.*\.sh$

  - repo: local
    hooks:
      # --- pre-commit -------------------------------------------------------
      - id: gofmt
        name: gofmt
        language: system
        entry: gofmt -l -w
        types: [go]
        stages: [pre-commit]

      # Lints only what changed since HEAD (govet, staticcheck, gosec, ...),
      # so it stays fast and doesn't trip over pre-existing code.
      # Keep the version in step with .github/workflows/lint-backend.yml.
      # language_version builds it with go.mod's Go (golangci-lint refuses to lint a
      # module newer than the Go it was built with); bump it with go.mod.
      - id: golangci-lint
        name: golangci-lint (changed code)
        language: golang
        language_version: 1.27.3
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        entry: golangci-lint run --new-from-rev HEAD
        types: [go]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: golangci-lint-config-verify
        name: golangci-lint config verify
        language: golang
        language_version: 1.27.3
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        entry: golangci-lint config verify
        files: ^\.golangci\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      # Fails when go.mod/go.sum drift from the imports.
      - id: go-mod-tidy
        name: go mod tidy -diff
        language: system
        entry: go mod tidy -diff
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
        stages: [pre-commit]

      - id: eslint
        name: eslint
        language: system
        entry: npx --no-install eslint --no-warn-ignored
        types_or: [ts, tsx, javascript, jsx]
        stages: [pre-commit]

      # --- pre-push ---------------------------------------------------------
      - id: golangci-lint-full
        name: golangci-lint (whole module)
        language: golang
        language_version: 1.27.3
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        entry: golangci-lint run
        types: [go]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

      # Needs Docker: the backend tests start a ClickHouse testcontainer.
      - id: go-test
        name: go test -race
        language: system
        entry: bash -c 'go test -race $(go list ./... | grep -v /testhelpers)'
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
        stages: [pre-push]

      - id: typecheck
        name: tsc --noEmit
        language: system
        entry: npm run typecheck
        files: ^(src/|tests/|tsconfig|package(-lock)?\.json)
        pass_filenames: false
        stages: [pre-push]

      - id: jest
        name: jest
        language: system
        entry: npm run test:ci
        files: ^(src/|jest|package(-lock)?\.json)
        pass_filenames: false
        stages: [pre-push]
